# 放入轻舟简历域名现有 server 块；保留原有证书、接口代理和静态资源配置。
# 该 server 的 root 应指向 /var/www/snowflake/web。

# 首页只保留一个正式地址，查询参数原样保留。
location = / {
    return 301 /resume$is_args$args;
}

# 独立网页的地址不保留结尾斜杠。
location ~ ^(/resume(?:/[^/.]+)*)/$ {
    return 301 $1$is_args$args;
}

# 核心公开页必须命中实际文件，不回退成通用空壳。
location = /resume {
    try_files /resume/index.html =404;
}

location = /resume/template {
    try_files /resume/template/index.html =404;
}

location = /resume/example {
    return 404;
}

# 范本地址严格按产物查找，未知标识返回真实的不存在状态。
location /resume/example/ {
    try_files $uri/index.html =404;
}

# 其他已生成页面优先返回独立网页，编辑器保留客户端路由回退。
location /resume/ {
    try_files $uri/index.html /index.html;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}
