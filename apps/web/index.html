<!doctype html>
<html lang="<%= defaultLang %>">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="<%= siteMetadata.favicon %>" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="<%= siteMetadata.description %>" />
    <meta name="keywords" content="<%= siteMetadata.keywords %>" />
    <!-- 社交分享卡片：所有路由共用同一份 HTML，此处只能给出产品默认值，按路由的卡片需要预渲染支持 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="轻舟简历" />
    <meta property="og:title" content="<%= siteMetadata.title %>" />
    <meta property="og:description" content="<%= siteMetadata.description %>" />
    <meta property="og:url" content="<%= siteUrl %>/resume" />
    <meta property="og:image" content="<%= siteUrl %>/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= siteMetadata.title %>" />
    <meta name="twitter:description" content="<%= siteMetadata.description %>" />
    <meta name="twitter:image" content="<%= siteUrl %>/og-image.png" />
    <title><%= siteMetadata.title %></title>
    <!-- 结构化数据：描述产品本身，在任意路由下都成立，因此静态输出 -->
    <!-- Organization 同时声明中英两个品牌名并作为产品的 publisher，用于告知搜索引擎二者是同一实体 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "<%= siteUrl %>/#organization",
            "name": "轻舟简历",
            "alternateName": "Skiff Resume",
            "url": "<%= siteUrl %>/resume"
          },
          {
            "@type": "SoftwareApplication",
            "name": "轻舟简历",
            "alternateName": "Skiff Resume",
            "url": "<%= siteUrl %>/resume",
            "description": <%- JSON.stringify(siteMetadata.description) %>,
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "zh-CN",
            "publisher": { "@id": "<%= siteUrl %>/#organization" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 静态兜底内容：无执行能力的抓取程序可直接读取标题与描述 -->
    <noscript>
      <div style="max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.8">
        <h1><%= siteMetadata.title %></h1>
        <p><%= siteMetadata.description %></p>
        <p>该页面的在线编辑与导出能力需要启用 JavaScript 后使用。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
