<!doctype html>
<html lang="<%= defaultLang %>">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="<%= siteMetadata.favicon %>" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="<%= siteMetadata.description %>" />
    <meta name="keywords" content="<%= siteMetadata.keywords %>" />
    <title><%= siteMetadata.title %></title>
    <!-- 首屏关键样式内联：不依赖外部样式表，主 CSS 异步加载期间即可渲染骨架 -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f2f1f6;
      }
      body {
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .sf-boot {
        display: flex;
        width: 100%;
        height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .sf-boot__ring {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(80, 162, 255, 0.25);
        border-top-color: #50a2ff;
        border-radius: 50%;
        animation: sf-spin 0.8s linear infinite;
      }
      .sf-boot__title {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        color: rgba(0, 0, 0, 0.8);
      }
      .sf-boot__tip {
        margin: 0;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.4);
      }
      @keyframes sf-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #000;
        }
        .sf-boot__title {
          color: rgba(255, 255, 255, 0.8);
        }
        .sf-boot__tip {
          color: rgba(255, 255, 255, 0.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sf-boot__ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 首屏静态骨架：应用挂载后被替换，主 CSS 与 JS 未就绪时先给出可见内容 -->
      <div class="sf-boot">
        <div class="sf-boot__ring"></div>
        <p class="sf-boot__title"><%= siteMetadata.title %></p>
        <p class="sf-boot__tip">正在加载，请稍候…</p>
      </div>
    </div>
    <!-- 静态兜底内容：无执行能力的抓取程序可直接读取标题与描述 -->
    <noscript>
      <div style="max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.8">
        <h1><%= siteMetadata.title %></h1>
        <p><%= siteMetadata.description %></p>
        <p>该页面的在线编辑与导出能力需要启用 JavaScript 后使用。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
