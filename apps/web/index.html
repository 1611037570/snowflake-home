<!doctype html>
<html lang="<%= defaultLang %>">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="<%= siteMetadata.favicon %>" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      /* 移动端锁定页面缩放：布局按视口高度铺满，页面被缩放后会出现露底与错位 */
      html,
      body {
        /* 只保留滚动与平移，禁用双指、双击缩放 */
        touch-action: pan-x pan-y;
      }
    </style>
    <script>
      // 旧版 iOS 会忽略 viewport 的 user-scalable=no，手势缩放再靠拦截 gesture 事件兜底
      ["gesturestart", "gesturechange", "gestureend"].forEach((name) => {
        document.addEventListener(name, (event) => event.preventDefault());
      });
    </script>
    <meta name="description" content="<%= siteMetadata.description %>" />
    <meta name="keywords" content="<%= siteMetadata.keywords %>" />
    <!-- 社交分享卡片：所有路由共用同一份 HTML，此处只能给出产品默认值，按路由的卡片需要预渲染支持 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="轻舟简历" />
    <meta property="og:title" content="<%= siteMetadata.title %>" />
    <meta property="og:description" content="<%= siteMetadata.description %>" />
    <meta property="og:url" content="<%= siteUrl %>/resume" />
    <meta property="og:image" content="<%= siteUrl %>/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= siteMetadata.title %>" />
    <meta name="twitter:description" content="<%= siteMetadata.description %>" />
    <meta name="twitter:image" content="<%= siteUrl %>/og-image.png" />
    <title><%= siteMetadata.title %></title>
    <!-- 结构化数据：描述产品本身，在任意路由下都成立，因此静态输出 -->
    <!-- Organization 同时声明中英两个品牌名并作为产品的 publisher，用于告知搜索引擎二者是同一实体 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "<%= siteUrl %>/#organization",
            "name": "轻舟简历",
            "alternateName": "Skiff Resume",
            "url": "<%= siteUrl %>/resume"
          },
          {
            "@type": "SoftwareApplication",
            "name": "轻舟简历",
            "alternateName": "Skiff Resume",
            "url": "<%= siteUrl %>/resume",
            "description": <%- JSON.stringify(siteMetadata.description) %>,
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "zh-CN",
            "publisher": { "@id": "<%= siteUrl %>/#organization" },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
          }
        ]
      }
    </script>
    <script>
      // 打包时写入公开路由的信息，应用脚本加载前按地址更新同一个 index.html。
      (() => {
        const pages = <%- resumeSeoMetadata %>;
        const route = window.location.pathname.replace(/\/+$/, "") || "/";
        const page = pages[route];
        if (!page) return;
        const origin = <%- JSON.stringify(siteUrl) %> || window.location.origin;
        const url = `${origin.replace(/\/+$/, "")}${route}`;
        const updateTag = (selector, value) => {
          const tag = document.querySelector(selector);
          if (tag) tag.setAttribute("content", value);
        };
        document.title = page.title;
        updateTag('meta[name="description"]', page.description);
        updateTag('meta[name="keywords"]', page.keywords);
        updateTag('meta[property="og:title"]', page.title);
        updateTag('meta[property="og:description"]', page.description);
        updateTag('meta[property="og:url"]', url);
        updateTag('meta[name="twitter:title"]', page.title);
        updateTag('meta[name="twitter:description"]', page.description);
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement("link");
          canonical.rel = "canonical";
          document.head.appendChild(canonical);
        }
        canonical.href = url;
        // 模板页描述的是范本与排版样式集合，不沿用首页的产品结构化数据。
        if (route === "/resume/template") {
          const schema = document.querySelector('script[type="application/ld+json"]');
          if (schema) schema.textContent = JSON.stringify({
            "@context": "https://schema.org", // 结构化数据词汇表。
            "@type": "CollectionPage", // 模板集合页面类型。
            name: page.title, // 页面标题。
            description: page.description, // 页面描述。
            url, // 当前页面地址。
          });
        }
      })();
    </script>
    <!-- 百度统计：所有路由共用同一份 HTML，装在 head 末尾即可全站生效 -->
    <script>
      var _hmt = _hmt || [];
      (function () {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?65283163761e236f6daaa88d85824bce";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 静态兜底内容：无执行能力的抓取程序可直接读取标题与描述 -->
    <noscript>
      <div style="max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.8">
        <h1><%= siteMetadata.title %></h1>
        <p><%= siteMetadata.description %></p>
        <p>该页面的在线编辑与导出能力需要启用 JavaScript 后使用。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
